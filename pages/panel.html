<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Panel - Fsh Captcha</title>
    <meta name="description" content="Easy, free and private captcha service.">
    <link rel="canonical" href="https://captcha.fsh.plus/panel">
    <!-- ------- -->
    <meta charset="UTF-8">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://fsh.plus/fsh.png" type="image/png">
    <meta name="theme-color" content="#a89c9b">
    <!-- ------- -->
    <link rel="stylesheet" href="https://fsh.plus/media/style.css">
    <script src="https://account.fsh.plus/script.js"></script>
    <!-- ------- -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <style>
      body, #grid {
        height: 100dvh;
      }
      .ag-cell {
        font-weight: 300;
      }
      .pie {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: conic-gradient(var(--green-1) 0% var(--per), var(--red-1) 0% 100%);
      }
    </style>
  </head>
  <body>
    <h2>Stats</h2>
    <div class="stats">
      <div>
        <p id="success-top">Success</p>
        <div class="pie" id="success-chart"></div>
      </div>
    </div>
    <h2>Latest solves</h2>
    <div id="grid"></div>
    <script>
      const dateFormat = params=>(params.value===null?'':new Date(params.value).toLocaleString(navigator, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }));
      class tickRender {
        eGui;
        init(params) {
          this.eGui = document.createElement('span');
          this.eGui.innerText = params.value?'✔':'✘';
          this.eGui.setAttribute('style', `color: var(--${params.value?'green':'red'}-1); display: flex; justify-content: center; align-items: center; height: 100%;`);
        }
        getGui() {
          return this.eGui;
        }
        refresh(params) {
          return false;
        }
      }

      let data = {data};
      data = data
        .map(line=>{
          line.os = line.ua.includes('Windows')?line.ua.split(';')[0].split('(')[1]:
            /Android/i.test(line.ua)?line.ua.match(/(Android( [0-9]+)?)/i)[0]:
            line.ua.includes('CrOS')?'ChromeOS':
            (line.ua.match(/Linux|iPhone|iPad|iPod|AppleTV|Mac/i)||['Unknown'])[0];
          line.browser = /Edg(e|a|ios)?\//i.test(line.ua)?'Edge':
            line.ua.includes('OPR/')?'Opera':
            line.ua.includes('YaBrowser/')?'Yandex':
            line.ua.includes('Trident/')?'Internet Explorer':
            (line.ua.match(/(Vivaldi|Chrome|Firefox|Safari|Ladybird)\/[0-9]+/i)||['Unknown'])[0].replace('/',' ');
          return line;
        });

      let success = (data.filter(line=>line.passed).length/data.length*100).toFixed(2)+'%';
      document.getElementById('success-top').innerText = `Success - ${success}`;
      document.getElementById('success-chart').style.setProperty('--per', success);

      const gridOptions = {
        theme: agGrid.themeQuartz
          .withPart(agGrid.colorSchemeDark)
          .withParams({
            fontFamily: 'Lexend, Arial, sans-serif',
            headerFontFamily: 'Lexend, Arial, sans-serif',
            cellFontFamily: 'Lexend, Arial, sans-serif',

            accentColor: 'var(--blue-1)',
            backgroundColor: 'var(--bg-1)'
          }),
        rowData: data,
        columnDefs: [
          { field: 'domain', flex: 1, filter: true },
          {
            field: 'passed',
            width: 100,
            filter: true,
            cellRenderer: tickRender
          },
          { field: 'os', width: 200, filter: true },
          { field: 'browser', width: 200, filter: true },
          { field: 'ua', flex: 1, filter: true },
          {
            field: 'when',
            width: 200,
            sort: 'desc',
            filter: 'agDateColumnFilter',
            filterParams: {
              includeTime: true,
              maxValidDate: new Date()
            },
            valueFormatter: dateFormat
          }
        ]
      };

      agGrid.createGrid(document.getElementById('grid'), gridOptions);
    </script>
  </body>
</html>
